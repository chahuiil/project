<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research project page — content coming soon.">
  <meta name="theme-color" content="#ffffff">
  <title>Research Project</title>
  <style>
:root {
  --bg: #fff;
  --ink: #222;
  --muted: #666;
  --accent: #165dab;
  --line: #ddd;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
p, h1, h2, h3, figure { margin: 0; }
.wrap { max-width: 1000px; margin-inline: auto; padding-inline: 28px; }
.site-header { padding: 18px 24px; }
.site-header nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 28px; font-size: 14px; }
.site-header nav a { color: var(--muted); }
.hero { text-align: center; padding-top: 36px; padding-bottom: 36px; }
.venue { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 14px; }
.draft-tag { color: var(--muted); }
h1 { margin: 18px auto 8px; font-size: clamp(28px, 4vw, 40px); line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.paper-title { max-width: 850px; margin: auto; font-size: clamp(23px, 3vw, 32px); line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.subtitle { max-width: 740px; margin: 18px auto 24px; color: var(--muted); }
.authors, .affiliations { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; }
.authors { font-size: 16px; }
sup { font-size: .7em; margin-left: 3px; }
.affiliations { margin-top: 10px; font-size: 14px; color: var(--muted); }
.equal { margin-top: 6px; font-size: 13px; color: var(--muted); }
.resource-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.resource { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; padding: 7px 16px; background: #fff; font-size: 14px; }
.resource.available:hover { border-color: var(--accent); }
.resource small { font-size: 12px; }
.resource[aria-disabled=true] { color: var(--muted); }
.teaser { overflow: hidden; border: 1px solid var(--line); background: #fff; aspect-ratio: 2.32; }
.teaser video, .demo-media video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.placeholder, .figure-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px; background: #fff; }
.placeholder { height: 100%; width: 100%; }
.placeholder-title { font-size: 18px; font-weight: 400; color: var(--muted); }
.placeholder-note { max-width: 420px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.media-caption { padding-top: 12px; font-size: 14px; color: var(--muted); }
.section { padding-top: 48px; padding-bottom: 24px; }
.overview { max-width: 860px; }
h2 { font-size: 26px; line-height: 1.3; font-weight: 600; }
.takeaway { margin-bottom: 28px; }
.takeaway-label { font-weight: 600; }
.takeaway p { display: inline; }
.body-copy { margin-top: 16px; line-height: 1.8; white-space: pre-line; }
.section-heading { margin-bottom: 24px; }
.section-aside { margin-top: 12px; color: var(--muted); }
.gallery-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid transparent; border-radius: 3px; background: #fff; color: var(--muted); padding: 7px 12px; font-size: 14px; }
.tab[aria-selected=true] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.tab:hover { text-decoration: underline; }
.gallery-controls { display: flex; align-items: center; gap: 8px; }
.gallery-controls > span { font-size: 13px; color: var(--muted); white-space: nowrap; margin-right: 4px; }
.icon-button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); font-size: 18px; display: grid; place-items: center; }
.icon-button:hover:not(:disabled), .copy-button:hover:not(:disabled) { border-color: var(--ink); }
.icon-button:disabled { opacity: .35; }
.group-description { margin: 16px 0 20px; font-size: 14px; color: var(--muted); }
.demo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.demo-card:only-child { grid-column: 1 / -1; }
.demo-media { aspect-ratio: 16/10; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.demo-topline { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; align-items: baseline; }
.demo-topline h3 { font-size: 16px; font-weight: 600; }
.demo-topline span { font-size: 13px; color: var(--muted); }
.demo-card > p { margin-top: 6px; font-size: 14px; color: var(--muted); }
.figure-panel { overflow: hidden; }
.figure-placeholder { min-height: 240px; border: 1px solid var(--line); }
.figure-panel figcaption { padding: 12px 0; font-size: 14px; color: var(--muted); }
.figure-button { display: block; border: 0; background: #fff; padding: 0; width: 100%; cursor: zoom-in; }
.figure-button img { display: block; max-width: 100%; max-height: 640px; margin: auto; }
.method-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 20px; }
.method-step h3 { font-size: 16px; font-weight: 600; }
.method-step p { margin-top: 8px; font-size: 14px; color: var(--muted); }
.citation-section { padding-bottom: 48px; }
.citation-box { min-width: 0; margin-top: 20px; border: 1px solid var(--line); border-radius: 3px; background: #fff; overflow: hidden; }
.citation-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.copy-button { background: #fff; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; padding: 5px 10px; }
.copy-button:disabled { color: var(--muted); }
.citation-box pre { padding: 16px; margin: 0; overflow: auto; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
footer { border-top: 1px solid var(--line); padding-block: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 13px; }
.skip { position: absolute; top: -80px; left: 15px; padding: 12px; background: #fff; z-index: 10; }
.skip:focus { top: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
dialog { border: 1px solid var(--line); border-radius: 3px; padding: 45px 20px 20px; max-width: 95vw; max-height: 95vh; }
dialog::backdrop { background: #000a; }
dialog img { max-width: 85vw; max-height: 80vh; display: block; }
dialog .icon-button { position: absolute; right: 10px; top: 8px; }
.noscript { padding: 30px; text-align: center; }
.media-error { padding: 25px; font-size: 14px; color: var(--muted); }
[hidden] { display: none !important; }

@media (max-width: 700px) {
  .wrap { padding-inline: 20px; }
  .site-header { padding-inline: 20px; }
  .site-header nav { gap: 10px 20px; font-size: 13px; }
  .hero { padding-top: 24px; padding-bottom: 28px; }
  .subtitle { font-size: 15px; }
  .authors { gap: 8px 14px; font-size: 15px; }
  .teaser { aspect-ratio: 1.5; }
  .section { padding-top: 36px; padding-bottom: 16px; }
  h2 { font-size: 24px; }
  .gallery-toolbar { flex-wrap: wrap; }
  .gallery-controls { margin-left: auto; }
  .demo-grid, .method-steps { grid-template-columns: 1fr; }
  .figure-placeholder { min-height: 200px; }
  .citation-section { padding-bottom: 36px; }
  footer { align-items: flex-start; flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><nav aria-label="Main navigation"><a href="#overview">Overview</a><a href="#demos">Demos</a><a href="#method">Method</a><a href="#citation">Citation</a></nav></header>
  <main id="main">
    <section class="hero wrap" aria-labelledby="project-name">
      <p class="venue"><span id="venue"></span><span class="draft-tag" id="draft-tag">Draft</span></p>
      <h1 id="project-name"></h1><p class="paper-title" id="paper-title"></p><p class="subtitle" id="subtitle"></p>
      <div class="authors" id="authors"></div><div class="affiliations" id="affiliations"></div><p class="equal" id="equal-note">* Equal contribution</p>
      <div class="resource-links" id="resource-links" aria-label="Project resources"></div>
    </section>
    <section class="teaser-section wrap" aria-label="Project teaser"><div id="teaser" class="teaser"></div><div class="media-caption"><p id="teaser-caption"></p></div></section>
    <section id="overview" class="wrap overview section"><div><div class="takeaway"><span class="takeaway-label">TL;DR: </span><p id="tldr"></p></div><h2>Abstract</h2><p class="body-copy" id="abstract"></p></div></section>
    <section id="demos" class="demos-section section"><div class="wrap"><div class="section-heading"><div><h2>Demonstrations</h2></div></div><div class="gallery-toolbar"><div class="tabs" id="demo-tabs" role="tablist" aria-label="Demonstration categories"></div><div class="gallery-controls"><span id="gallery-counter" aria-live="polite"></span><button id="previous" class="icon-button" aria-label="Previous demonstration">←</button><button id="next" class="icon-button" aria-label="Next demonstration">→</button></div></div><p id="group-description" class="group-description"></p><div id="demo-panel" role="tabpanel" tabindex="0"><div class="demo-grid" id="demo-grid"></div></div></div></section>
    <section id="method" class="wrap section"><div class="section-heading"><div><h2>Method</h2></div><p id="method-intro" class="section-aside wide"></p></div><figure class="figure-panel" id="method-figure"></figure><div id="method-steps" class="method-steps"></div></section>
    <section id="results" class="wrap section results-section"><div class="section-heading"><div><h2>Results</h2></div><p id="results-text" class="section-aside wide"></p></div><figure class="figure-panel" id="results-figure"></figure></section>
    <section id="citation" class="wrap section citation-section"><div><h2>Citation</h2><p class="body-copy">Citation details will be available with the paper.</p></div><div class="citation-box"><div class="citation-toolbar"><span>BibTeX</span><button id="copy-citation" class="copy-button">Copy citation</button></div><pre><code id="bibtex"></code></pre><p id="copy-status" role="status" class="sr-only"></p></div></section>
  </main>
  <footer class="wrap"><div><span id="footer-text"></span></div><a href="#">Back to top ↑</a></footer>
  <dialog id="image-dialog"><button id="close-dialog" class="icon-button" aria-label="Close enlarged figure">×</button><img id="dialog-image" alt=""></dialog>
  <noscript><p class="noscript">Please enable JavaScript to load the project information.</p></noscript>
<script>
/* Edit the content here. Paths are relative to index.html. Empty links stay disabled.
   Full editing and publishing instructions: README.md (한국어). */
window.PROJECT = {
  name: 'PROJECT NAME',
  title: 'Your paper title goes here.',
  subtitle: 'A concise sentence that captures the central idea of your research.',
  venue: 'Research project',
  draft: true, // Set false when all placeholder content has been replaced.
  authors: [
    { name: 'First Author', affiliation: '1', equal: true, url: '' },
    { name: 'Second Author', affiliation: '1,2', equal: true, url: '' },
    { name: 'Third Author', affiliation: '2', equal: false, url: '' }
  ],
  affiliations: ['Institution / Laboratory', 'Collaborating Institution'],
  links: { paper: '', arxiv: '', code: '', video: '' },
  teaser: { src: '', poster: '', caption: 'Add a short caption describing the main demonstration.' },
  tldr: 'Add the one key idea you want visitors to remember about your paper.',
  abstract: 'Introduce the problem, explain the core idea of your approach, and summarize the main findings. Replace this text with your paper’s abstract when it is ready.',
  demoGroups: [
    { name: 'Table', description: 'Table domain', items: [
      { title: 'Table', detail: '', src: 'assets/videos/demo_table.mp4', poster: '' }
    ] },
    { name: 'Floor', description: 'Floor domain', items: [
      { title: 'Floor', detail: '', src: 'assets/videos/demo_floor.mp4', poster: '' }
    ] },
    { name: 'Wall (high-height)', description: 'Wall domain (high-height)', items: [
      { title: 'Wall (high-height)', detail: '', src: '', poster: '' }
    ] },
    { name: 'Wall (low-height)', description: 'Wall domain (low-height)', items: [
      { title: 'Wall (low-height)', detail: '', src: '', poster: '' }
    ] },
    { name: 'Stair', description: 'Stair domain', items: [
      { title: 'Stair', detail: '', src: '', poster: '' }
    ] }
  ],
  method: {
    intro: 'Explain how your approach works. Start with the main insight, then use the overview figure to connect the components.',
    image: '', alt: 'Method overview figure', caption: 'Add the method overview figure and its caption.',
    steps: [
      { title: 'The challenge', text: 'What makes the problem difficult, and why do existing approaches fall short?' },
      { title: 'The key insight', text: 'Describe the central contribution and how it addresses the challenge.' },
      { title: 'The outcome', text: 'Explain what the method enables, supported by your experimental evidence.' }
    ]
  },
  results: { image: '', alt: 'Experimental results figure', caption: 'Add a results plot, comparison table, or ablation figure.', text: 'Summarize the main experimental findings here. Include only measurements supported by the paper.' },
  bibtex: '', // Paste the final BibTeX record here, using a backtick-delimited string.
  footer: 'Research project page',
};
</script>
<script>
'use strict';
(() => {
  const p = window.PROJECT;
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const set = (id, text) => { $(id).textContent = text; };
  function safeURL(value) {
    if (!value || typeof value !== 'string') return '';
    try { const u = new URL(value, location.href); return ['http:', 'https:', 'file:'].includes(u.protocol) ? value : ''; } catch { return ''; }
  }
  function placeholder(title, note) {
    const n = el('div', 'placeholder');
    n.append(el('p', 'placeholder-title', title), el('p', 'placeholder-note', note));
    return n;
  }
  function media(item, hero = false) {
    if (!safeURL(item.src)) return placeholder(hero ? 'Project video' : item.title, hero ? 'Add your project’s main video here.' : 'Video coming soon.');
    const v = el('video'); v.src = safeURL(item.src); v.controls = true; v.playsInline = true; v.preload = 'metadata';
    if (safeURL(item.poster)) v.poster = safeURL(item.poster);
    v.setAttribute('aria-label', item.title || 'Project teaser video');
    v.addEventListener('error', () => v.replaceWith(el('p','media-error','This video could not be loaded. Please check the file path and format.')), { once: true });
    return v;
  }
  document.title = `${p.name} — ${p.title}`;
  document.querySelector('meta[name="description"]').content = p.subtitle;
  set('project-name', p.name); set('paper-title', p.title); set('subtitle', p.subtitle); set('venue', p.venue);
  $('draft-tag').hidden = !p.draft;
  for (const a of p.authors) {
    const n = safeURL(a.url) ? el('a', '', a.name) : el('span', '', a.name);
    if (n.tagName === 'A') { n.href = safeURL(a.url); n.target = '_blank'; n.rel = 'noopener noreferrer'; }
    n.append(el('sup', '', `${a.affiliation}${a.equal ? '*' : ''}`)); $('authors').append(n);
  }
  p.affiliations.forEach((name, i) => { const n = el('span'); n.append(el('sup', '', String(i + 1)), document.createTextNode(` ${name}`)); $('affiliations').append(n); });
  $('equal-note').hidden = !p.authors.some(a => a.equal);
  [['paper','Paper'], ['arxiv','arXiv'], ['code','Code'], ['video','Video']].forEach(([key, name]) => {
    const url = safeURL(p.links[key]); const a = el(url ? 'a' : 'span', `resource${url ? ' available' : ''}`);
    a.append(document.createTextNode(name));
    if (url) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    else { a.setAttribute('aria-disabled', 'true'); a.append(el('small', '', 'Soon')); }
    $('resource-links').append(a);
  });
  $('teaser').append(media(p.teaser, true)); set('teaser-caption',p.teaser.caption); set('tldr',p.tldr); set('abstract',p.abstract);
  let group = 0, start = 0;
  const mq = window.matchMedia('(max-width:700px)');
  const pageSize = () => mq.matches ? 1 : 2;
  function renderGallery() {
    if (!p.demoGroups.length) return;
    const g = p.demoGroups[group], size = pageSize();
    start = Math.min(start, Math.max(0,g.items.length-size));
    $('demo-grid').replaceChildren();
    const end = Math.min(start+size,g.items.length);
    g.items.slice(start,end).forEach((item,i) => {
      const card = el('article','demo-card'), frame = el('div','demo-media'), top = el('div','demo-topline'); frame.append(media(item));
      top.append(el('h3','',item.title));
      if (g.items.length > 1) top.append(el('span','',String(start+i+1).padStart(2,'0')));
      card.append(frame,top);
      if (item.detail) card.append(el('p','',item.detail));
      $('demo-grid').append(card);
    });
    set('group-description',g.description); set('gallery-counter',g.items.length ? `${start+1}${end > start+1 ? '–'+end : ''} / ${g.items.length}` : '0 / 0');
    $('previous').disabled = start === 0; $('next').disabled = end >= g.items.length;
    document.querySelector('.gallery-controls').hidden = g.items.length <= size;
    document.querySelectorAll('.tab').forEach((t,i) => { t.setAttribute('aria-selected',String(i===group)); t.tabIndex = i===group ? 0 : -1; });
    $('demo-panel').setAttribute('aria-labelledby',`demo-tab-${group}`);
  }
  p.demoGroups.forEach((g,i) => {
    const b = el('button','tab',g.name); b.id = `demo-tab-${i}`; b.setAttribute('role','tab'); b.setAttribute('aria-controls','demo-panel');
    b.addEventListener('click',() => { group=i; start=0; renderGallery(); });
    b.addEventListener('keydown',e => {
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      e.preventDefault(); const count=p.demoGroups.length; group=e.key==='Home' ? 0 : e.key==='End' ? count-1 : (i+(e.key==='ArrowRight'?1:-1)+count)%count;
      start=0; renderGallery(); $(`demo-tab-${group}`).focus();
    }); $('demo-tabs').append(b);
  });
  $('previous').onclick=()=>{start=Math.max(0,start-pageSize());renderGallery();};
  $('next').onclick=()=>{start+=pageSize();renderGallery();}; mq.addEventListener('change',renderGallery);
  if (p.demoGroups.length) renderGallery(); else $('demos').hidden=true;
  let imageTrigger;
  function figure(id, data, isMethod) {
    const container=$(id);
    if (safeURL(data.image)) {
      const b=el('button','figure-button'),img=el('img'); img.src=safeURL(data.image);img.alt=data.alt;img.loading='lazy';b.setAttribute('aria-label',`Enlarge ${data.alt}`);b.append(img);
      b.onclick=()=>{imageTrigger=b;$('dialog-image').src=img.src;$('dialog-image').alt=img.alt;$('image-dialog').showModal();};
      img.onerror=()=>b.replaceWith(el('p','media-error','This figure could not be loaded. Please check its file path.'));container.append(b);
    } else {
      const n=el('div','figure-placeholder');
      n.append(el('p','placeholder-title',isMethod ? 'Method overview' : 'Experimental results'),el('p','placeholder-note','Figure coming soon.'));
      container.append(n);
    }
    container.append(el('figcaption','',data.caption));
  }
  set('method-intro',p.method.intro);figure('method-figure',p.method,true);set('results-text',p.results.text);figure('results-figure',p.results,false);
  p.method.steps.forEach(s=>{const n=el('article','method-step');n.append(el('h3','',s.title),el('p','',s.text));$('method-steps').append(n);});
  $('close-dialog').onclick=()=>$('image-dialog').close();
  $('image-dialog').addEventListener('click',e=>{if(e.target===$('image-dialog'))$('image-dialog').close();});
  $('image-dialog').addEventListener('close',()=>imageTrigger?.focus());
  set('bibtex',p.bibtex.trim() || '% Citation coming soon.\n% Add the final BibTeX entry when your paper is available.');
  $('copy-citation').disabled=!p.bibtex.trim();
  if(p.bibtex.trim()) document.querySelector('.citation-section .body-copy').textContent='If you find this work useful, please cite our paper.';
  $('copy-citation').onclick=async()=>{try {await navigator.clipboard.writeText(p.bibtex);set('copy-citation','Copied ✓');set('copy-status','Citation copied to clipboard.');setTimeout(()=>set('copy-citation','Copy citation'),2000);}catch{const range=document.createRange();range.selectNodeContents($('bibtex'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);set('copy-citation','Text selected');set('copy-status','Copy with Control C or Command C.');}};
  set('footer-text',p.footer);
})();
</script>
</body>
</html>
